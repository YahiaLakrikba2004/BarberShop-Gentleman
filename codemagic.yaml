workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_store_connect
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        BUNDLE_ID: "com.gentleman.barber"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Force Create Certificate (Debug)
        script: |
          echo "Attempting to create certificate..."
          app-store-connect create-certificate --type IOS_DISTRIBUTION --save || echo "Certificate creation failed"
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -exec dir "{}" \;
          flutter packages pub get
          cd ios && pod install && cd ..
      - name: Flutter build ipa and automatic versioning
        script: |
          flutter build ipa --release \
            --export-options-plist=/usr/local/share/workspace/ios/Runner/ExportOptions.plist
      - name: Publish to TestFlight
        script: |
          app-store-connect publish --path $(find build/ios/ipa -name "*.ipa")
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
